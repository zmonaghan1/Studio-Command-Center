name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run all checks
        run: npm run check
