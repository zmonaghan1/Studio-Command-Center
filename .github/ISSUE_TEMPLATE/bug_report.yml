name: Bug report
description: Something isn't working as expected
labels: ['type: bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Budget view
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
